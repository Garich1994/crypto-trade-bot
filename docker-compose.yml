services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MINIAPP_HOST: 0.0.0.0
      MINIAPP_PORT: "8080"
    volumes:
      - ./data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bot
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
